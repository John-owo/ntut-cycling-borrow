<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>幹部管理｜北科大自由車社</title><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./style.css"><script type="module" src="./i18n.js"></script><script src="./config.js" defer></script><script type="module" src="./admin.js"></script></head><body class="admin-page"><a class="skip" href="#main">跳到主要內容</a><div class="shell"><header><a class="brand" href="./index.html"><img class="club-logo" src="./ntut-club-logo.png" alt="" width="80" height="80"><span class="brand-name">北科大自由車社<span>NTUT CYCLING CLUB</span></span></a><a href="./index.html">回公開看板 ↗</a><div class="language-switch" role="group" aria-label="Language"><button type="button" data-language="zh" lang="zh-Hant">中文</button><button type="button" data-language="en" lang="en">EN</button></div></header><main id="main"><section class="admin-title"><p class="eyebrow">GARAGE DESK / 幹部管理</p><h1>交車與歸還，在這裡確認。</h1><p>完成實際交車或收車後再操作。登記不會預先扣除車數。</p></section>
<section id="login-panel" class="login-panel"><h2>幹部登入</h2><p>請使用自己的管理帳號，系統會記錄經手人。</p><form id="login-form"><label id="username-label">管理帳號<input name="username" required autocomplete="username" maxlength="150"></label><label>密碼<input name="password" type="password" required autocomplete="current-password" maxlength="256"></label><button type="submit">登入</button></form><p id="login-message" class="message" role="status"></p></section>
<section id="workspace" hidden><div class="section-heading"><p id="identity"></p><button type="button" class="text-button" id="logout">登出</button></div><div class="metrics"><div><span>社車總數</span><strong id="total">—</strong></div><div><span>已借出</span><strong id="borrowed">—</strong></div><div><span>尚未借出</span><strong id="available">—</strong></div><div><span>登記等候</span><strong id="waiting">—</strong></div></div><div class="admin-toolbar"><div class="filters" role="group" aria-label="篩選借用狀態"><button data-filter="waiting" aria-pressed="true">等候登記</button><button data-filter="borrowed" aria-pressed="false">借用中</button><button data-filter="history" aria-pressed="false">歷史紀錄</button></div><div class="sync"><span id="sync-status" role="status"></span><button class="text-button" id="refresh" type="button">更新</button></div></div><p id="action-message" class="message" role="status"></p><div id="records"></div>
<section class="settings"><h2>基本設定</h2><p>請輸入實際盤點的車數。總數不能低於已借出車數。</p><form id="settings-form"><label>社車總數<input name="total" type="number" required min="0" max="10000" step="1"></label><label>社團聯絡入口<input name="contactUrl" type="url" placeholder="https://…" maxlength="500"></label><p class="fine">請填入社員可聯絡幹部的正式 HTTPS 連結。</p><button type="submit">儲存設定</button></form><p id="settings-message" class="message" role="status"></p></section></section>
<dialog id="action-dialog"><form id="action-form"><h2 id="dialog-title"></h2><p id="dialog-description"></p><label id="note-label">車號／現場備註（選填）<textarea name="bikeNote" maxlength="500" rows="3"></textarea></label><p id="dialog-message" class="message" role="status"></p><div class="dialog-actions"><button id="dialog-cancel" type="button" class="secondary">返回</button><button id="dialog-confirm" type="submit">確認</button></div></form></dialog></main><footer>北科大自由車社 / NTUT CYCLING CLUB</footer></div></body></html>
